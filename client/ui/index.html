<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sharepack</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 12x12 icons, color: currentColor -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-folder" viewBox="0 0 12 12">
    <path d="M1.5 2.5h3.2l1 1.2h4.8v5.8h-9z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-redownload" viewBox="0 0 12 12">
    <path d="M9.6 4.6A3.9 3.9 0 1 0 9.9 7.4" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M10.2 1.6v3.3H6.9" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-delete" viewBox="0 0 12 12">
    <path d="M2 3.2h8M4.6 3.2V1.9h2.8v1.3M3.1 3.2l.6 7h4.6l.6-7M5 5.1v3.3M7 5.1v3.3" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-chevron" viewBox="0 0 12 12">
    <path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<template id="console-toggle">
  <button class="console-toggle" data-i18n-title="console_collapse"><svg viewBox="0 0 12 12"><use href="#i-chevron"/></svg></button>
  <button class="console-bar" data-i18n="console_open"></button>
</template>

<template id="window-buttons">
  <div class="window-buttons">
    <button class="wb" data-action="minimize" data-i18n-title="minimize">
      <svg viewBox="0 0 10 10"><path d="M0 5.5H10" stroke="currentColor" stroke-width="1" shape-rendering="crispEdges"/></svg>
    </button>
    <button class="wb wb--close" data-action="close" data-i18n-title="close">
      <svg viewBox="0 0 10 10"><path d="M0.5 0.5L9.5 9.5M9.5 0.5L0.5 9.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="square"/></svg>
    </button>
  </div>
</template>

<!-- Splash (Figma: launch 515:27) -->
<section id="launch" class="screen is-active">
  <div class="bg bg--launch">
    <img class="bg-img" src="assets/background.webp" alt="">
    <div class="bg-shade bg-shade--launch"></div>
  </div>
  <div class="drag pywebview-drag-region"></div>
  <div data-window-buttons></div>
  <div class="launch-header pywebview-drag-region">
    <img class="icon icon--59" src="assets/icon.png" alt="">
    <div class="launch-titles">
      <p class="title">sharepack</p>
      <p class="tagline" data-i18n="splash"></p>
    </div>
  </div>
</section>

<!-- Update available (Figma: update 517:295) -->
<section id="update" class="screen">
  <div class="bg bg--launch">
    <img class="bg-img" src="assets/background.webp" alt="">
    <div class="bg-shade bg-shade--launch"></div>
  </div>
  <div class="drag pywebview-drag-region"></div>
  <div data-window-buttons></div>
  <div class="content">
    <div class="launch-header pywebview-drag-region">
      <img class="icon icon--59" src="assets/icon.png" alt="">
      <div class="launch-titles">
        <p class="title">sharepack</p>
        <p class="tagline tagline--wide"><span data-i18n="update_available"></span> <span id="update-version"></span></p>
      </div>
    </div>
    <div class="update-buttons">
      <button id="update-download" class="start start--ok update-download" data-i18n="update_download"></button>
      <button id="update-later" class="start start--ready update-later" data-i18n="update_later"></button>
    </div>
  </div>
</section>

<!-- Main screen (Figma: main 512:3) -->
<section id="main" class="screen">
  <div class="bg">
    <img class="bg-img" src="assets/background.webp" alt="">
    <div class="bg-shade bg-shade--main"></div>
  </div>
  <div class="head"></div>
  <div class="drag pywebview-drag-region"></div>
  <div data-window-buttons></div>

  <div class="content">
    <header class="header">
      <div class="fulllogo pywebview-drag-region">
        <img class="icon icon--43" src="assets/icon.png" alt="">
        <p class="title">sharepack</p>
      </div>
      <p class="tagline" data-i18n-html="tagline"></p>
    </header>

    <div class="nickname">
      <label class="label label--nick" for="nick" data-i18n="nick_label"></label>
      <!-- Nickname field with the saved nicknames list -->
      <div class="dropdown combo" id="dd-nick">
        <input id="nick" class="input" data-i18n-placeholder="nick_placeholder" maxlength="16" spellcheck="false" autocomplete="off">
        <button type="button" class="combo-toggle" data-i18n-title="saved_nicks"><img class="chevron" src="assets/chevron.svg" width="14" height="8" alt=""></button>
        <div class="dropdown-list"></div>
      </div>
    </div>

    <div class="choose">
      <div class="field">
        <label class="label" for="code" data-i18n="code_label"></label>
        <input id="code" class="input" data-i18n-placeholder="code_placeholder" spellcheck="false" autocomplete="off">
      </div>
      <div class="or">
        <span data-i18n="or"></span>
        <img src="assets/divider.svg" width="2" height="74" alt="">
      </div>
      <div class="field">
        <span class="label" data-i18n="choose_label"></span>
        <div class="dropdown" id="dd-pack" data-placeholder="choose_placeholder"></div>
      </div>
    </div>

    <div class="buttons">
      <button id="start" class="start" disabled data-i18n="idle"></button>
      <button class="gear" data-go="settings" data-i18n-title="settings_open"><img src="assets/settings.png" alt=""></button>
    </div>

    <div class="console">
      <div id="main-console" class="console-text"></div>
      <div class="console-scroll"><div class="console-thumb"></div></div>
      <div data-console-toggle></div>
    </div>
  </div>
</section>

<!-- Settings (Figma: main 515:218) -->
<section id="settings" class="screen">
  <div class="bg"><div class="bg-shade bg-shade--main"></div></div>
  <div class="drag pywebview-drag-region"></div>
  <div data-window-buttons></div>

  <div class="content">
    <header class="header">
      <div class="fulllogo pywebview-drag-region">
        <img class="icon icon--43" src="assets/icon.png" alt="">
        <p class="title" data-i18n="settings_title"></p>
      </div>
    </header>

    <!-- Links to the right of the title (Figma: links 518:395) -->
    <div class="links">
      <button id="lang" class="link link--lang" data-i18n-title="lang_title"></button>
      <button class="link link--github" data-link="github" title="GitHub"><img src="assets/github.png" width="21" height="21" alt="GitHub"></button>
      <button class="link" data-link="m" title="mstudio"><img src="assets/m.svg" width="22" height="11" alt="m"></button>
    </div>

    <div class="setting" style="left:30px;top:79px">
      <div class="label-row">
        <span class="label" data-i18n="profiles_dir"></span>
        <button id="open-profiles" class="icon-button" data-i18n-title="open_profiles">
          <svg viewBox="0 0 12 12"><use href="#i-folder"/></svg>
        </button>
      </div>
      <div class="dropdown" id="dd-dir" data-placeholder="default"></div>
    </div>
    <div class="setting" style="left:222px;top:78px">
      <span class="label" data-i18n="ram"></span>
      <div class="dropdown" id="dd-ram" data-placeholder="default"></div>
    </div>
    <div class="setting" style="left:30px;top:145px">
      <span class="label" data-i18n="java"></span>
      <div class="dropdown" id="dd-java" data-placeholder="default"></div>
    </div>
    <div class="setting" style="left:222px;top:145px">
      <label class="label" for="s-args" data-i18n="java_args"></label>
      <input id="s-args" class="input" data-i18n-placeholder="default" spellcheck="false" autocomplete="off">
    </div>

    <div class="buttons">
      <button id="save" class="start start--ready" data-i18n="save"></button>
      <button class="gear" data-go="main" data-i18n-title="settings_back"><img src="assets/settings.png" alt=""></button>
    </div>

    <div class="console">
      <div id="settings-console" class="console-text"></div>
      <div class="console-scroll"><div class="console-thumb"></div></div>
      <div data-console-toggle></div>
    </div>
  </div>
</section>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
